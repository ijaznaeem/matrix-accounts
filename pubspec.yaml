name: veyo_sync
description: Veyo Sync – Real-Time Business Accounts & Inventory
publish_to: "none"

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  flutter_riverpod: ^2.5.0
  go_router: ^14.0.0

  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1

  path_provider: ^2.1.0
  excel: ^4.0.0
  fl_chart: ^0.69.0
  intl: ^0.19.0
  flutter_svg: ^2.0.10
  shared_preferences: ^2.2.0
  image_picker: ^1.0.7
  file_picker: ^10.0.0
  pdf: ^3.10.0
  printing: ^5.11.0
  share_plus: ^7.2.1
  path: ^1.8.3
  package_info_plus: ^9.0.0
  screenshot: ^3.0.0
  local_auth: ^2.1.6
  uuid: ^4.5.1
  crypto: ^3.0.3
  url_launcher: ^6.3.2
  connectivity_plus: ^6.0.3
  http: ^1.2.2
  cross_file: ^0.3.4+2
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.0
  isar_generator: ^3.1.0+1
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icons/app_icon.png"
    background_color: "#ffffff"
    theme_color: "#ffffff"
  windows:
    generate: true
    image_path: "assets/icons/app_icon.png"
    icon_size: 48

flutter_native_splash:
  color: "#ffffff"
  image: assets/icons/splash_logo.png
  color_dark: "#121212"
  image_dark: assets/icons/splash_logo.png
  android_12:
    image: assets/icons/splash_logo.png
    icon_background_color: "#ffffff"
    image_dark: assets/icons/splash_logo.png
    icon_background_color_dark: "#121212"
  web: false

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/icons/
    - assets/excel_templates/
